services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # host.docker.internal allows the container to connect to the VPS host's local database
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:changeme@host.docker.internal:5432/game}
      JWT_SECRET: ${JWT_SECRET:-super-secret}
      PORT: 3005
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-admin-key-1}
    ports:
      - "3005:3005"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  uploads:
