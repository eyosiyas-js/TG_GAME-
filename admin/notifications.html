<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Notifications</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .nav { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .nav a { color: #38bdf8; text-decoration: none; font-size: 1.1rem; }
        .nav a.active { font-weight: bold; border-bottom: 2px solid #38bdf8; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; max-width: 600px; }
        .card h2 { margin-top: 0; color: #e2e8f0; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 0.75rem; border-radius: 4px; border: 1px solid #334155; 
            background: #0f172a; color: #f8fafc; font-size: 1rem; box-sizing: border-box; 
        }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; }
        button:hover { background: #0ea5e9; }
        
        .alert { display: none; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; font-weight: bold; }
        .alert-success { background: #14532d; color: #4ade80; border: 1px solid #166534; }
        .alert-error { background: #7f1d1d; color: #f87171; border: 1px solid #991b1b; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Admin Dashboard</h1>
    <div class="nav">
        <a href="users.html">Users</a>
        <a href="deposits.html">Deposits</a>
        <a href="withdrawals.html">Withdrawals</a>
        <a href="index.html">Historical Matches</a>
        <a href="active-games.html">Active Games</a>
        <a href="revenue.html">Revenue</a>
        <a href="settings.html">Settings</a>
        <a href="notifications.html" class="active">Notifications</a>
    </div>

    <div class="card">
        <h2>Send Notification</h2>
        
        <div id="successMsg" class="alert alert-success">Notification sent successfully!</div>
        <div id="errorMsg" class="alert alert-error">Error sending notification.</div>

        <div class="form-group">
            <label>Target Audience</label>
            <select id="targetSelect" onchange="handleTargetChange()">
                <option value="all">All Users</option>
                <option value="single">Specific User</option>
                <option value="multiple">Multiple Users</option>
            </select>
        </div>

        <div class="form-group hidden" id="userSelectionGroup">
            <label>Select User(s)</label>
            <input type="text" id="userSearch" placeholder="Search by username..." oninput="filterUsers()" style="margin-bottom: 0.5rem;">
            <select id="userSelect" multiple style="height: 120px;">
                <!-- Loaded remotely -->
            </select>
            <small style="color: #64748b; font-size: 0.8rem; margin-top: 5px; display: block;">Hold Ctrl/Cmd to select multiple users</small>
        </div>

        <div class="form-group">
            <label>Notification Type</label>
            <select id="notiType">
                <option value="system">System Notice</option>
                <option value="promo">Promotion / Bonus</option>
                <option value="alert">Account Alert</option>
            </select>
        </div>

        <div class="form-group">
            <label>Title</label>
            <input type="text" id="notiTitle" placeholder="e.g. Server Maintenance">
        </div>

        <div class="form-group">
            <label>Message Body</label>
            <textarea id="notiMessage" rows="4" placeholder="Enter the notification details..."></textarea>
        </div>

        <button id="sendBtn" onclick="sendNotification()">Send Notification</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', loadUsers);

        let allUsers = [];

        const DOM = {
            target: document.getElementById('targetSelect'),
            userSelectionGroup: document.getElementById('userSelectionGroup'),
            userSearch: document.getElementById('userSearch'),
            userSelect: document.getElementById('userSelect'),
            type: document.getElementById('notiType'),
            title: document.getElementById('notiTitle'),
            message: document.getElementById('notiMessage'),
            sendBtn: document.getElementById('sendBtn'),
            errorBox: document.getElementById('errorMsg'),
            successBox: document.getElementById('successMsg')
        };

        function handleTargetChange() {
            const target = DOM.target.value;
            if (target === 'all') {
                DOM.userSelectionGroup.classList.add('hidden');
            } else {
                DOM.userSelectionGroup.classList.remove('hidden');
                if (target === 'single') {
                    DOM.userSelect.removeAttribute('multiple');
                    DOM.userSelect.style.height = 'auto';
                } else {
                    DOM.userSelect.setAttribute('multiple', 'multiple');
                    DOM.userSelect.style.height = '120px';
                }
            }
        }

        async function loadUsers() {
            const token = localStorage.getItem('token') || '';
            try {
                const res = await fetch('http://localhost:3005/notifications/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load users');
                allUsers = await res.json();
                renderUsers(allUsers);
            } catch (e) {
                console.error('User load error:', e);
            }
        }

        function filterUsers() {
            const query = DOM.userSearch.value.toLowerCase();
            const filtered = allUsers.filter(u => u.username.toLowerCase().includes(query));
            
            // Get currently selected values to preserve them if they are filtered out
            const selectedValues = Array.from(DOM.userSelect.selectedOptions).map(o => o.value);
            
            let html = '';
            
            // Add selected options even if they don't match the search currently
            allUsers.forEach(u => {
                if (selectedValues.includes(u.id)) {
                    html += `<option value="${u.id}" selected>${u.username}</option>`;
                } else if (u.username.toLowerCase().includes(query)) {
                    html += `<option value="${u.id}">${u.username}</option>`;
                }
            });

            DOM.userSelect.innerHTML = html;
        }

        function renderUsers(users) {
            let html = '';
            users.forEach(u => {
                html += `<option value="${u.id}">${u.username}</option>`;
            });
            DOM.userSelect.innerHTML = html;
        }

        async function sendNotification() {
            const target = DOM.target.value;
            const title = DOM.title.value.trim();
            const message = DOM.message.value.trim();
            const type = DOM.type.value;
            
            DOM.errorBox.style.display = 'none';
            DOM.successBox.style.display = 'none';

            if (!title || !message) {
                showError('Please provide both title and message.');
                return;
            }

            let userIds = [];
            if (target !== 'all') {
                const selectedOptions = Array.from(DOM.userSelect.selectedOptions);
                if (selectedOptions.length === 0) {
                    showError('Please select at least one user.');
                    return;
                }
                userIds = selectedOptions.map(o => o.value);
            }

            DOM.sendBtn.disabled = true;
            DOM.sendBtn.textContent = 'Sending...';

            const token = localStorage.getItem('token') || '';
            
            // The backend controller expects `userIds` array for both 'single' and 'multiple'
            const payload = {
                target,
                type,
                title,
                message,
                userIds: userIds
            };

            try {
                const res = await fetch('http://localhost:3005/notifications/admin/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || err.message || 'Failed to send notification');
                }
                
                showSuccess(`Notification sent to ${target === 'all' ? 'all users' : target === 'single' ? '1 user' : userIds.length + ' users'}`);
                DOM.title.value = '';
                DOM.message.value = '';
            } catch (e) {
                showError(e.message);
            } finally {
                DOM.sendBtn.disabled = false;
                DOM.sendBtn.textContent = 'Send Notification';
            }
        }

        function showError(msg) {
            DOM.errorBox.textContent = msg;
            DOM.errorBox.style.display = 'block';
        }

        function showSuccess(msg) {
            DOM.successBox.textContent = msg;
            DOM.successBox.style.display = 'block';
        }
    </script>
</body>
</html>
